name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Check Blender authoring script syntax
        run: python3 -m py_compile scripts/blender/sls_asset_preflight.py
      - name: Generate deterministic G2 development twins
        run: npm run twins:generate
      - name: Verify deterministic G2 development twins
        run: npm run twins:check
      - name: Validate embedded glTF binary contracts
        run: npm run gltf:validate
      - name: KTX2 material builder self-test
        run: npm run material:ktx2:selftest
      - name: Material source ingestion self-test
        run: npm run material:source:selftest
      - run: npm test
      - run: npm run build
      - run: npm run budget
      - run: npm run budget:functions
      - run: npm run smoke:shopify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa
          path: playwright-output/
          if-no-files-found: warn
          retention-days: 7
